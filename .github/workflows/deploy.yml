name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --no-interpolate -q

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      INSTANCE_ID: i-04f3836bb868b3ae6
    steps:
      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | python3 -c "import sys,base64,json; s=sys.stdin.read().strip(); s+='='*(-len(s)%4); d=json.loads(base64.urlsafe_b64decode(s)); print('sub:',d['sub']); print('aud:',d['aud']); print('iss:',d['iss'])"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::692584137916:role/github-deploy-role
          aws-region: eu-north-1

      - name: Deploy via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u ubuntu bash -c \"set -e; cd /home/ubuntu/saleor-deploy; git pull origin main; /home/ubuntu/fetch-secrets.sh; docker compose config -q; docker compose pull; docker compose up -d --remove-orphans; docker image prune -f\""]' \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          [ "$STATUS" = "Success" ] || { echo "Deploy status: $STATUS"; exit 1; }

      - name: Health check
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors \
            https://rahulsaleor.duckdns.org/ -o /dev/null
